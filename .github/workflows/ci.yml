# CppHub CI — multi-platform build & test
# Runs on Windows (MSVC) and Ubuntu (GCC) to catch cross-platform regressions.
# Core library is always built; optional modules (C API, CUDA, Python) are tested
# in separate jobs to keep the matrix manageable.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  # ---------------------------------------------------------------------------
  # Core build + test: Windows MSVC and Ubuntu GCC
  # No optional features — validates the header-only core + test suite.
  # ---------------------------------------------------------------------------
  build-test:
    name: Build & Test (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # pinned: win25 (windows-latest) 将随 VS2026 转正移除 VS2022; win22 支持至 2027-10
          - os: windows-2022
            compiler: MSVC
            cmake_generator: "Visual Studio 17 2022"
            cmake_extra: ""
          - os: ubuntu-latest
            compiler: GCC
            cmake_generator: "Ninja"
            cmake_extra: "-DCMAKE_CXX_FLAGS=-ffp-contract=off"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # third_party/eigen 是 submodule (ADR-013); 缺失导致 Eigen/Dense 编译失败
          submodules: recursive

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache GoogleTest
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: gtest-1.14.0-${{ runner.os }}-${{ matrix.compiler }}

      # shell: bash — Windows 默认 pwsh 不认 bash 反斜杠续行, 逐行拆成独立命令导致
      # "-G: command not found" (自 run #1 起 Windows Configure 全败的根因)
      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build \
            -G "${{ matrix.cmake_generator }}" \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build --config ${{ env.CMAKE_BUILD_TYPE }} --parallel 4

      - name: Run Tests
        working-directory: build
        run: ctest --build-config ${{ env.CMAKE_BUILD_TYPE }} --output-on-failure --parallel 4

  # ---------------------------------------------------------------------------
  # C ABI build + test: validates the ADR-009 stable boundary
  # Runs on both platforms with CPPHUB_ENABLE_C_API=ON.
  # ---------------------------------------------------------------------------
  c-api:
    name: C ABI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache GoogleTest
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: gtest-1.14.0-${{ runner.os }}-capi

      - name: Configure CMake (C API enabled)
        shell: bash
        run: |
          cmake -S . -B build \
            -G "${{ runner.os == 'Windows' && 'Visual Studio 17 2022' || 'Ninja' }}" \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DCPPHUB_ENABLE_C_API=ON

      - name: Build
        run: cmake --build build --config ${{ env.CMAKE_BUILD_TYPE }} --parallel 4

      - name: Run C API Tests
        working-directory: build
        run: ctest --build-config ${{ env.CMAKE_BUILD_TYPE }} -R "CApi" --output-on-failure --parallel 4
