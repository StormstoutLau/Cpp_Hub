# CppHub CI — multi-platform build & test
# Runs on Windows (MSVC) and Ubuntu (GCC) to catch cross-platform regressions.
# Core library is always built; optional modules (C API, CUDA, Python) are tested
# in separate jobs to keep the matrix manageable.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  # ---------------------------------------------------------------------------
  # Core build + test: Windows MSVC and Ubuntu GCC
  # No optional features — validates the header-only core + test suite.
  # ---------------------------------------------------------------------------
  build-test:
    name: Build & Test (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # pinned: win25 (windows-latest) 将随 VS2026 转正移除 VS2022; win22 支持至 2027-10
          - os: windows-2022
            compiler: MSVC
            cmake_generator: "Visual Studio 17 2022"
            cmake_extra: ""
          - os: ubuntu-latest
            compiler: GCC
            cmake_generator: "Ninja"
            cmake_extra: "-DCMAKE_CXX_FLAGS=-ffp-contract=off"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # third_party/eigen 是 submodule (ADR-013); 缺失导致 Eigen/Dense 编译失败
          submodules: recursive

      # RISK-033 供应链守卫 (ADD 审计 P3-1): URL 钉 commit 形态被意外回退时 CI 直接红。
      # 旧 tag 检测用字符类 [.] 拼写, guard 自身文本 (含本注释) 不得出现旧版本号字面量,
      # 否则 grep 命中自身 (变量拼接已在 run 39755779788 实证失败)。
      - name: Guard googletest pinned to immutable commit (R-033)
        shell: bash
        run: |
          grep -q "codeload.github.com/google/googletest/tar.gz/f8d7d77c06936315286eb55f8de22cd23c188571" CMakeLists.txt
          ! grep -q "gtest-1[.]14[.]0" .github/workflows/ci.yml

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache GoogleTest
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: gtest-f8d7d77c-${{ runner.os }}-${{ matrix.compiler }}

      # shell: bash — Windows 默认 pwsh 不认 bash 反斜杠续行, 逐行拆成独立命令导致
      # "-G: command not found" (自 run #1 起 Windows Configure 全败的根因)
      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build \
            -G "${{ matrix.cmake_generator }}" \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build --config ${{ env.CMAKE_BUILD_TYPE }} --parallel 4

      - name: Check version header (RISK-032)
        if: runner.os == 'Linux'
        shell: bash
        run: python3 tools/sync_version.py --check

      - name: Run Tests
        working-directory: build
        run: ctest --build-config ${{ env.CMAKE_BUILD_TYPE }} --output-on-failure --parallel 4

  # ---------------------------------------------------------------------------
  # C ABI build + test: validates the ADR-009 stable boundary
  # Runs on both platforms with CPPHUB_ENABLE_C_API=ON.
  # ---------------------------------------------------------------------------
  c-api:
    name: C ABI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache GoogleTest
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: gtest-f8d7d77c-${{ runner.os }}-capi

      - name: Configure CMake (C API enabled)
        shell: bash
        run: |
          cmake -S . -B build \
            -G "${{ runner.os == 'Windows' && 'Visual Studio 17 2022' || 'Ninja' }}" \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DCPPHUB_ENABLE_C_API=ON

      - name: Build
        run: cmake --build build --config ${{ env.CMAKE_BUILD_TYPE }} --parallel 4

      - name: Run C API Tests
        working-directory: build
        run: ctest --build-config ${{ env.CMAKE_BUILD_TYPE }} --output-on-failure --parallel 4

  # ---------------------------------------------------------------------------
  # 覆盖率报告 (U-3: 仅报告, 无阈值)
  # Debug 避开 Release 的 -march 硬编码; 只统计 include/cpphub/。
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage (ubuntu-latest, GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcc g++ && python3 -m pip install gcovr
      - name: Configure (coverage)
        run: |
          cmake -S . -B build_cov -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage -O0 -g" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"
      - name: Build
        run: cmake --build build_cov --parallel 4
      - name: Test
        working-directory: build_cov
        run: ctest --output-on-failure --parallel 4
      - name: gcovr report
        # gcovr 8.x 默认对 "suspicious hits" 直接抛 SuspiciousHitsError,
        # 而该形态是 gcov 工具自身 bug (gcc.gnu.org/bugzilla 68080, for 循环行
        # 非递减计数), 与源码无关 — 按 gcovr 建议降级为 warn (run 39990450582
        # math.hpp:113 实证, Test 步骤已 2538/2538 全绿)
        run: |
          gcovr --root . --filter 'include/cpphub/' --exclude 'third_party' \
                --gcov-ignore-parse-errors suspicious_hits.warn \
                --xml coverage.xml --html-details coverage.html
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage*.html

  # ---------------------------------------------------------------------------
  # Python bindings + MCP shell: nanobind extension build + pytest
  # spec/mcp-server S5: 跨平台一致性以 python/tests/fixtures/mcp_golden.json 为准
  # (结构 byte-exact + 数值容差)；Linux 侧关闭 FMA 收缩以与 build-test 口径一致。
  # ---------------------------------------------------------------------------
  python:
    name: Python (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install package with MCP extra
        shell: bash
        env:
          # 跨平台数值可复现: 禁止 FMA 收缩 (与 build-test 的 GCC 口径一致)
          CMAKE_ARGS: ${{ runner.os == 'Linux' && '-DCMAKE_CXX_FLAGS=-ffp-contract=off' || '' }}
        run: python -m pip install "./python[test,mcp]"

      - name: Show toolchain versions
        # nanobind 是 build-only 依赖 (build isolation, 不入运行环境):
        # import 它会在 runner 上 ModuleNotFoundError (run 39755779788 4 个 python job 实证)
        run: |
          python -c "import sys, cpphub; print(sys.version); print('cpphub', cpphub.__version__)"
          python -c "import mcp; print('mcp', getattr(mcp, '__version__', 'n/a'))"

      - name: Run Python tests
        run: python -m pytest python/tests -v
