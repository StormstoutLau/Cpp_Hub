# Cpp_Hub Python 绑定构建配置 (nanobind)
#
# 使用方式:
#   1. pip install nanobind scikit-build-core cmake ninja
#   2. pip install .                    # 构建并安装 cpphub Python 模块
#   3. python -c "import cpphub; print(cpphub.bsm_price(100, 100, 1, 0.05, 0, 0.2, True))"
#
# 开发模式:
#   pip install -e . --no-build-isolation
#
# 约束:
#   - 需要 C++20 编译器 (MSVC 19.29+ / GCC 10+ / Clang 12+)
#   - 需要 CMake 3.25+
#   - 无 nanobind 时 CMake 自动跳过 Python 模块 (CPPHUB_ENABLE_PYTHON=OFF)

[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "cpphub"
version = "1.4.0"
description = "Cpp_Hub: Quantitative finance library (BSM/Heston/MC/Greeks/VaR/COS/PDE/Tree/RoughVol/SABR)"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "../LICENSE"}
authors = [{name = "Scott (鹏)"}]
keywords = ["quantitative-finance", "options", "heston", "greeks", "var"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "numpy>=1.20", "scipy>=1.7"]

[tool.scikit-build]
cmake.version = ">=3.25"
cmake.args = ["-DCPPHUB_ENABLE_PYTHON=ON"]
build-dir = "build_python"
wheel.packages = ["src/cpphub"]

[tool.cibuildwheel]
test-requires = ["pytest", "numpy", "scipy"]
test-command = "pytest {project}/python/tests -v"
